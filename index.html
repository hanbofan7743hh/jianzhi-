<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3b2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>减脂记录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b9e72'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-dasharray='78 120' transform='rotate(-90 32 32)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b9e72'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-dasharray='78 120' transform='rotate(-90 32 32)'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f5f3; --card:#fff; --ink:#0f1d18; --sub:#6f8078; --line:#e8efeb; --line2:#dbe8e1;
  --green:#0b9e72; --green-d:#087a58; --mint:#dff5ec; --deep:#0b3b2c;
  --orange:#ef8f4c; --red:#df5f55; --blue:#4c8ee8;
  --radius:20px;
  --shadow:0 1px 2px rgba(12,40,30,.04), 0 16px 36px -26px rgba(12,40,30,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(900px 380px at 50% -170px,#d6f0e4,transparent 72%);
  background-repeat:no-repeat;background-attachment:fixed;
}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:520px;margin:0 auto;padding:0 15px 112px}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;margin:0 -15px;padding:14px 15px 8px;background:rgba(242,245,243,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tb-title{font-size:21px;font-weight:700;letter-spacing:-.01em}
.dateNav{display:flex;align-items:center;gap:7px;margin-top:5px}
.dateNav button{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:16px;line-height:1;display:grid;place-items:center;cursor:pointer;font-family:inherit}
.dateLabel{font-size:12.5px;color:var(--sub);min-width:126px;text-align:center}
.dateNav .today-btn{width:auto;padding:0 11px;font-size:12px;color:var(--green-d);border-color:#c9ebdd;background:var(--mint)}
.dateNav.hide{visibility:hidden}

/* 视图 */
.view{display:none}
.view.on{display:block;animation:fade .24s cubic-bezier(.2,.7,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.sec{display:flex;align-items:flex-end;justify-content:space-between;margin:20px 5px 9px}
.sec h3{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.sec span{font-size:11.5px;color:#9daba5}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:19px 17px 17px;color:#fff;
  background:linear-gradient(158deg,#0b3428 0%,#0d5441 52%,#0f7d5d 100%);
  box-shadow:0 22px 44px -26px rgba(11,52,40,.8)}
.hero::before{content:"";position:absolute;right:-56px;top:-86px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(88,232,178,.34),transparent 65%)}
.hero::after{content:"";position:absolute;left:-40px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(88,232,178,.13),transparent 70%)}
.h-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.h-tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8fe0c1;font-weight:600}
.h-goal{font-size:11.5px;color:rgba(255,255,255,.62)}
.ring-wrap{position:relative;width:190px;height:190px;margin:4px auto 2px;z-index:1}
.ring{width:100%;height:100%;display:block}
.ring-center{position:absolute;inset:0;display:grid;place-content:center;gap:2px;text-align:center}
.ring-num{font-size:39px;font-weight:800;line-height:1.05}
.ring-num small{font-size:12px;font-weight:500;color:rgba(255,255,255,.6);margin-left:3px}
.ring-label{font-size:11.5px;color:rgba(255,255,255,.6)}
.h-status{position:relative;z-index:1;text-align:center;font-size:13px;color:rgba(255,255,255,.82);margin-top:4px}
.h-status b{color:#5fe7b4;font-weight:700}
.h-status.over b{color:#ffb59c}
.h-steps{position:relative;z-index:1;text-align:center;font-size:11.5px;color:rgba(255,255,255,.5);margin-top:3px}
.h-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.h-stat{background:rgba(255,255,255,.085);border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:9px 4px;text-align:center}
.h-stat b{display:block;font-size:16px;font-weight:700;line-height:1.45}
.h-stat span{font-size:10.5px;color:rgba(255,255,255,.62)}

/* 食谱行 */
.plan-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line)}
.plan-row:last-child{border-bottom:none;padding-bottom:2px}
.plan-row:first-child{padding-top:2px}
.plan-ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:18px;background:#f2f7f5;flex:0 0 auto}
.plan-main{flex:1;min-width:0}
.plan-name{font-size:14px;font-weight:600}
.plan-sub{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.plan-k{font-size:13.5px;font-weight:700;color:var(--ink)}
.plan-k span{font-size:10px;color:#9daba5;font-weight:400}
.add-mini{width:34px;height:34px;border-radius:11px;border:none;background:var(--mint);color:var(--green-d);font-size:17px;line-height:1;cursor:pointer;font-family:inherit;flex:0 0 auto}
.add-mini:active{background:#cfeee0}
.chk{width:34px;height:34px;border-radius:11px;background:#f2f7f5;color:#9daba5;display:grid;place-items:center;font-size:14px;flex:0 0 auto}

/* 流水 */
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row-name{font-size:14px;font-weight:500}
.row-sub{font-size:11px;color:#96a49e;margin-top:1px;line-height:1.5}
.row-val{margin-left:auto;font-size:14px;font-weight:600;white-space:nowrap}
.row-val span{font-size:10px;color:#9daba5;font-weight:400;margin-left:1px}
.row-del{width:26px;height:26px;border-radius:8px;border:none;background:#f4f7f6;color:#afbbb5;font-size:15px;line-height:1;cursor:pointer;font-family:inherit;flex:0 0 auto}
.grp{display:flex;justify-content:space-between;font-size:12px;color:#8b9a94;margin:16px 0 0}
.grp b{font-weight:600;color:var(--ink)}
.empty{padding:28px 8px;text-align:center;color:#a8b5af;font-size:12.5px}

/* 分段 */
.seg{display:flex;gap:5px;padding:4px;background:#eff4f1;border-radius:14px}
.seg button{flex:1;padding:8px 0;border:none;border-radius:11px;background:none;color:var(--sub);font-size:12.5px;font-family:inherit;cursor:pointer;transition:.16s}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 2px 6px rgba(12,40,30,.1)}

/* chips */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(101px,1fr));gap:8px;margin-top:9px}
.chips.two{grid-template-columns:repeat(2,1fr)}
.chip{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 10px;text-align:left;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;gap:1px;cursor:pointer;transition:.14s;min-height:52px}
.chip:active{transform:scale(.985);background:var(--mint);border-color:#bfe8d8}
.chip.on{border-color:var(--green);background:var(--mint);box-shadow:0 0 0 2px rgba(11,158,114,.12)}
.chip span{font-size:12.5px;line-height:1.35;font-weight:500}
.chip i{font-style:normal;font-size:10px;color:#a0aea8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part-lbl{font-size:10.5px;color:#a3b1ab;letter-spacing:.06em;margin:12px 0 -2px;font-weight:600}

/* 编辑区 */
.composer{margin-top:12px;padding:13px;border-radius:16px;background:linear-gradient(180deg,#f2fbf7,#ecf8f2);border:1px solid #d2eee2}
.cp-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cp-row+.cp-row{margin-top:11px}
.cp-name{font-size:13.5px;font-weight:600}
.cp-kcal{font-size:15px;font-weight:800;color:var(--green-d)}
.cp-kcal span{font-size:10px;font-weight:400;color:var(--sub)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:9px;border:1px solid #c9e9db;background:#fff;color:var(--green-d);font-size:16px;line-height:1;cursor:pointer;font-family:inherit}
.stepper input{width:64px;height:30px;text-align:center;border:1px solid #c9e9db;border-radius:9px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;font-variant-numeric:tabular-nums}
.unit{font-size:11.5px;color:#8b9a94}
.btn{border:none;border-radius:12px;padding:9px 15px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;background:#eef3f0;color:var(--ink);transition:.14s}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 10px 20px -12px rgba(11,158,114,.9)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--sub)}
.btn.wide{width:100%;padding:12px 0;font-size:14px}
.btn:active{transform:translateY(1px)}
.btn.sm{padding:5px 11px;font-size:11.5px;border-radius:9px}

/* 组数行 */
.sethd,.setrow{display:grid;grid-template-columns:20px 1fr 12px 1fr 12px 1fr 26px;align-items:center;gap:5px}
.sethd{margin-top:10px;font-size:10px;color:#9daba5;text-align:center}
.sethd span:nth-child(2),.sethd span:nth-child(4),.sethd span:nth-child(6){text-align:center}
.setrow{margin-top:6px}
.setrow .si{height:34px;border:1px solid #d5e9df;border-radius:9px;text-align:center;font-size:14px;font-family:inherit;background:#fff;width:100%;min-width:0;padding:0 2px;color:var(--ink);font-variant-numeric:tabular-nums}
.setrow .si:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(11,158,114,.1)}
.setrow .xi{font-size:10px;color:#bcC8c2;text-align:center}
.setrow .idx{font-size:11px;color:#a3b1ab;text-align:center}
.str-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px dashed #cfe8dd;font-size:11.5px;color:#6f8078;flex-wrap:wrap}
.str-foot b{font-size:14px;color:var(--green-d);font-weight:800}

/* 表单 */
.field{display:flex;align-items:center;gap:10px;padding:7px 0}
.field label{font-size:13px;color:var(--sub);flex:0 0 auto;min-width:62px}
.field input,.field select{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:14px;font-family:inherit;color:var(--ink);background:#fafcfb;font-variant-numeric:tabular-nums}
.field input:focus,.field select:focus{outline:none;border-color:var(--green);background:#fff}
.fold{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.fold summary{font-size:12.5px;color:var(--green-d);cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary::before{content:"＋ ";font-weight:600}
.fold[open] summary::before{content:"－ "}

/* 图表 */
.chart{width:100%;height:auto;display:block;margin-top:2px}
.legend{display:flex;gap:14px;font-size:10.5px;color:#96a49e;margin-top:6px;padding-left:2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}
.mini{background:#f6faf8;border-radius:14px;padding:9px 6px;text-align:center}
.mini b{display:block;font-size:15.5px;font-weight:700;line-height:1.4}
.mini span{font-size:10.5px;color:var(--sub)}

/* 底栏 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 12px env(safe-area-inset-bottom);background:linear-gradient(to top,rgba(242,245,243,1) 52%,rgba(242,245,243,0))}
.tabbar-inner{width:100%;max-width:496px;display:flex;background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:20px;margin-bottom:9px;padding:5px;box-shadow:0 12px 34px -18px rgba(12,40,30,.55)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border:none;background:none;color:#93a29c;font-size:10.5px;font-family:inherit;cursor:pointer;border-radius:15px;transition:.16s}
.tab.on{color:var(--green-d);background:var(--mint)}
.tab svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* 提示 */
.toast{position:fixed;left:50%;bottom:118px;transform:translate(-50%,12px);background:rgba(11,59,44,.95);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:78%;text-align:center;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hint{font-size:11.5px;color:#9daba5;line-height:1.7;margin-top:9px}
.warn{font-size:11.5px;color:#b5734a;background:#fdf5ef;border-radius:11px;padding:9px 11px;margin-top:10px;line-height:1.6}
.note{font-size:11px;color:#98a6a0;background:#f6faf8;border-radius:11px;padding:8px 10px;margin-top:10px;line-height:1.6}
.stepsbig{display:flex;align-items:center;gap:10px}
.stepsbig input{flex:1;min-width:0;height:56px;border:1px solid var(--line2);border-radius:15px;padding:0 14px;font-size:26px;font-weight:700;font-family:inherit;background:#fafcfb;color:var(--ink);font-variant-numeric:tabular-nums;text-align:center}
.stepsbig input:focus{outline:none;border-color:var(--green);background:#fff}

/* 弹层 */
.modal{position:fixed;inset:0;z-index:60;display:none}
.modal.on{display:block}
.modal-bg{position:absolute;inset:0;background:rgba(10,30,22,.46)}
.modal-sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px -20px rgba(0,0,0,.4);animation:up .26s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.55}to{transform:none;opacity:1}}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-hd b{font-size:16px;font-weight:700}
.sheet-x{width:30px;height:30px;border-radius:10px;border:none;background:#f2f6f4;color:#8b9a94;font-size:16px;cursor:pointer;font-family:inherit}
.ckline{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:13px;color:#3d4f47}
.ckline input{width:18px;height:18px;accent-color:#0b9e72}
.pillrow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pill{font-size:11px;background:#fff;border:1px solid #d5e9df;color:#4b635a;border-radius:999px;padding:4px 10px;line-height:1.4}
</style>
</head>

</div>

/* 配速 mm'ss"/km */
function fmtPace(min, km){
  if(!(min>0) || !(km>0)) return '';
  var sec = min*60/km;
  var m = Math.floor(sec/60), s = Math.round(sec%60);
  if(s === 60){ m++; s = 0; }
  return m+"'"+('0'+s).slice(-2)+'" /km';
}

  var p = hr/mx;
  if(p < 0.6) return '热身';
  if(p < 0.7) return '燃脂';
  if(p < 0.8) return '有氧';
  if(p < 0.9) return '阈值';
  return '极限';
}

function migrateDays(s){
  Object.keys(s.days).forEach(function(k){
    var d = s.days[k];
    if(!d.meals) d.meals = [];
    if(!d.ex) d.ex = [];
    if(typeof d.steps !== 'number') d.steps = 0;
    d.ex.forEach(function(x){
      if(!x.kind){
        x.kind = 'car';
        x.type = 'other';
        x.minutes = Number(x.min) || 0;
        x.met = Number(x.met) || 5;
      }
      if(!x.id) x.id = uid();
    });
  });
  return s;
}
function load(){

/* ================= 工具 ================= */
function dkey(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function parseKey(k){ var p=k.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function shiftKey(k,n){ var d=parseKey(k); d.setDate(d.getDate()+n); return dkey(d); }
function fmtDate(k){
  var d = parseKey(k);
  var wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  var base = (d.getMonth()+1)+'月'+d.getDate()+'日 '+wd;
  var today = dkey(new Date());
  if(k===today) return '今天 · '+base;
  if(k===shiftKey(today,-1)) return '昨天 · '+base;
  return base;
}
function getDay(k, create){
  if(!S.days[k]){
    if(!create) return null;
    S.days[k] = {meals:[], ex:[], steps:0, weight:null};
  }
  var d = S.days[k];
  if(!d.meals) d.meals = [];
  if(!d.ex) d.ex = [];
  if(typeof d.steps !== 'number') d.steps = 0;
  return d;
}
function peekDay(k){ return S.days[k] || null; }
function foodLib(){ return FOOD_DB.concat(S.customFoods); }
function mealLabel(id){ for(var i=0;i<MEALS.length;i++) if(MEALS[i].id===id) return MEALS[i].label; return '加餐'; }
function uid(){ return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); }
function r0(n){ return Math.round(n); }
function fmt(n){ return String(r0(n)).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function foodKcal(f, amt){ return f.unit==='克' ? (f.k||0)*amt/100 : (f.base||0)*amt; }
function amtText(amt, unit){ return amt+' '+unit; }

function weightPoints(){
  return Object.keys(S.days).filter(function(k){ return S.days[k].weight > 0; }).sort()
    .map(function(k){ return {k:k, w:Number(S.days[k].weight)}; });
}
function curWeight(){
  var pts = weightPoints();
  if(pts.length){
    var today = dkey(new Date());
    var past = pts.filter(function(p){ return p.k <= today; });
    if(past.length) return past[past.length-1].w;
    return pts[0].w;
  }
  return Number(S.profile.weight) || 120;
}
function bmr(){ return 10*curWeight() + 6.25*(Number(S.profile.height)||170) - 5*(Number(S.profile.age)||20) + 5; }
function tdee(){ return bmr() * (Number(S.profile.activity)||1.2); }
function suggestTarget(){ return Math.max(1500, Math.round(tdee()-600)); }
function targetKcal(){ return Number(S.profile.target) > 0 ? Math.round(Number(S.profile.target)) : suggestTarget(); }

function totals(k){
  var d = peekDay(k);
  if(!d) return {inK:0, outK:0, net:0, steps:0, cnt:0, strCnt:0, carMin:0};
  var i = 0, o = 0, strCnt = 0, carMin = 0;
  (d.meals||[]).forEach(function(x){ i += Number(x.kcal)||0; });
  (d.ex||[]).forEach(function(x){
    o += Number(x.kcal)||0;
    if(x.kind==='str') strCnt += (x.sets||[]).reduce(function(a,s){ return a+(Number(s.sets)||0); },0);
    if(x.kind==='car') carMin += Number(x.minutes)||0;
  });
  return {inK:r0(i), outK:r0(o), net:r0(i-o), steps:d.steps||0,
          cnt:(d.meals||[]).length+(d.ex||[]).length, strCnt:strCnt, carMin:r0(carMin)};
}

/* —— 热量公式 —— */
function burnMet(met, min, w){ return met*3.5*w/200*min; }
/* 跑步 / 快走：ACSM 耗氧方程，距离优先 */
function burnRun(min, distKm, grade, w, running){
  var v = distKm*1000/min;            /* m/min */
  var g = (grade||0)/100;
  var vo2 = (running ? 0.2*v + 0.9*v*g : 0.1*v + 1.8*v*g) + 3.5;
  return vo2*w/1000*5*min;
}
function strMinutes(totalSets){ return Math.max(5, Math.ceil(totalSets*2.5)); }
function strVolume(sets){
  return sets.reduce(function(a,s){ return a + (Number(s.w)||0)*(Number(s.reps)||0)*(Number(s.sets)||0); }, 0);
}
function strTotalSets(sets){
  return sets.reduce(function(a,s){ return a + (Number(s.sets)||0); }, 0);
}
function setsText(sets){
  return sets.map(function(s){
    var w = Number(s.w)||0;
    return (w>0 ? w+'kg' : '自重') + ' × ' + (Number(s.reps)||0) + ' × ' + (Number(s.sets)||0);
  }).join('  /  ');
}
function setsShort(sets){
  return sets.map(function(s){
    var w = Number(s.w)||0;
    return (w>0 ? w : '自重') + '×' + (Number(s.reps)||0) + '×' + (Number(s.sets)||0);
  }).join(' / ');
}
function lastStrEntry(name){
  var keys = Object.keys(S.days).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var d = S.days[keys[i]];
    var hit = (d.ex||[]).filter(function(x){ return x.kind==='str' && x.name===name; });
    if(hit.length) return hit[hit.length-1];
  }
  return null;
}
function lastStrDay(){
  var keys = Object.keys(S.days).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var list = (S.days[keys[i]].ex||[]).filter(function(x){ return x.kind==='str'; });
    if(list.length) return {k:keys[i], list:list};
  }
  return null;
}
function cardioKcal(c){
  var w = curWeight();
  var t = Number(c.minutes)||0;
  if(!(t>0)) return 0;
  var def = carById(c.type);
  var dist = Number(c.distance)||0;
  var inc = Number(c.incline)||0;
  if(def && (def.mode==='run' || def.mode==='walk') && dist>0){
    return burnRun(t, dist, inc, w, def.mode==='run');
  }
  if(def) return burnMet(def.met + (def.mode==='walk' ? inc*0.12 : inc*0.08), t, w);
  return burnMet(Number(c.met)||5, t, w);
}
function stepsKm(steps){ return (Number(steps)||0)*0.7/1000; }
function stepsKcal(steps){ return 0.5*curWeight()*stepsKm(steps); }

function renderToday(){

/* ================= 体重 ================= */
/* 曲线区间按日期窗口取，不按记录条数 */
function weightSeries(){
  var today = dkey(new Date());
  var from = shiftKey(today, -(ui.range-1));
  return weightPoints().filter(function(p){ return p.k >= from && p.k <= today; });
}
/* 7 日移动平均，用来压掉水分造成的锯齿 */
function smoothSeries(pts){
  if(pts.length < 4) return [];
  return pts.map(function(p){
    var t = parseKey(p.k).getTime(), sum = 0, c = 0;
    pts.forEach(function(q){
      if(Math.abs(parseKey(q.k).getTime() - t) <= 3*86400000){ sum += q.w; c++; }
    });
    return {k:p.k, w:sum/c};
  });
}
function weightChart(){
  var today = dkey(new Date());
  var fromK = shiftKey(today, -(ui.range-1));
  var used = weightSeries();
  var tg = Number(S.profile.targetWeight) || 0;
  if(!used.length) return '<div class="empty">这段时间还没有体重记录</div>';

  var smooth = ui.range >= 30 ? smoothSeries(used) : [];
  var vals = used.map(function(p){ return p.w; });
  smooth.forEach(function(p){ vals.push(p.w); });
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if(tg>0){ mn = Math.min(mn,tg); mx = Math.max(mx,tg); }
  if(mx-mn < 1){ mn -= .5; mx += .5; }
  var pad = (mx-mn)*.18; mn -= pad; mx += pad;

  var W=340,H=186,L=38,R=14,T=16,B=30;
  var iw = W-L-R, ih = H-T-B;
  var D0 = parseKey(fromK).getTime(), D1 = parseKey(today).getTime();
  var span = Math.max(D1-D0, 86400000);
  function pxOf(k){ return L + iw*(parseKey(k).getTime()-D0)/span; }
  function py(v){ return T + ih*(1-(v-mn)/(mx-mn)); }

  var grid='', labels='';
  for(var g=0; g<4; g++){
    var v = mn + (mx-mn)*g/3, yy = py(v);
    grid += '<line x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'" stroke="#eef3f1" stroke-width="1"/>';
    labels += '<text x="'+(L-8)+'" y="'+(yy+3.2).toFixed(1)+'" text-anchor="end" font-size="9" fill="#a8b5af">'+v.toFixed(1)+'</text>';
  }

  var pxy = used.map(function(p){ return [pxOf(p.k), py(p.w)]; });
  var ptsStr = pxy.map(function(a){ return a[0].toFixed(1)+','+a[1].toFixed(1); }).join(' ');
  var area = '<polygon points="'+pxy[0][0].toFixed(1)+','+(T+ih)+' '+ptsStr+' '+pxy[pxy.length-1][0].toFixed(1)+','+(T+ih)+'" fill="url(#g1)" opacity=".15"/>';
  var line = '<polyline points="'+ptsStr+'" fill="none" stroke="#0b9e72" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity=".5"/>';

  var smoothLine = '';
  if(smooth.length){
    var sp = smooth.map(function(p){ return pxOf(p.k).toFixed(1)+','+py(p.w).toFixed(1); }).join(' ');
    smoothLine = '<polyline points="'+sp+'" fill="none" stroke="#0b9e72" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>';
  }

  var dots = used.length <= 60 ? used.map(function(p,i){
    return '<circle cx="'+pxy[i][0].toFixed(1)+'" cy="'+pxy[i][1].toFixed(1)+'" r="'+(used.length<=20?2.9:2)+'" fill="#fff" stroke="#0b9e72" stroke-width="1.8" opacity=".92"/>';
  }).join('') : '';

  var tgLine = '';
  if(tg>0 && tg>=mn && tg<=mx){
    tgLine = '<line x1="'+L+'" y1="'+py(tg).toFixed(1)+'" x2="'+(W-R)+'" y2="'+py(tg).toFixed(1)+'" stroke="#f0904f" stroke-width="1.3" stroke-dasharray="4 4"/>'
      + '<text x="'+(W-R)+'" y="'+(py(tg)-4).toFixed(1)+'" text-anchor="end" font-size="9" fill="#f0904f">目标 '+tg+'</text>';
  }

  function xlab(k, anchor, x){

/* ================= 周训练量 ================= */
function weekStartKey(k){
  var d = parseKey(k);
  var wd = (d.getDay()+6)%7;
  d.setDate(d.getDate()-wd);
  return dkey(d);
}
function weeklySeries(n){
  var rows = [], idx = {};
  var thisW = weekStartKey(dkey(new Date()));
  for(var i=n-1;i>=0;i--){
    var ws = shiftKey(thisW, -7*i);
    var r = {k:ws, car:0, vol:0, sets:0};
    rows.push(r); idx[ws] = r;
  }
  Object.keys(S.days).forEach(function(k){
    var r = idx[weekStartKey(k)];
    if(!r) return;
    var d = S.days[k];
    (d.ex||[]).forEach(function(x){
      if(x.kind==='car') r.car += Number(x.minutes)||0;
      else if(x.kind==='str'){ r.vol += strVolume(x.sets||[]); r.sets += strTotalSets(x.sets||[]); }
    });
  });
  return rows;
}
function barChart(rows, valFn, color){
  var W=340, H=112, L=30, R=8, T=16, B=22;
  var iw = W-L-R, ih = H-T-B;
  var vals = rows.map(valFn);
  var mx = Math.max.apply(null, vals.concat([1]));
  var bw = iw/rows.length;
  var barW = Math.min(24, bw*0.58);
  var s = '';
  s += '<line x1="'+L+'" y1="'+T+'" x2="'+(W-R)+'" y2="'+T+'" stroke="#eef3f1"/>';
  s += '<text x="'+(L-6)+'" y="'+(T+3.5)+'" text-anchor="end" font-size="8" fill="#a8b5af">'+fmt(mx)+'</text>';
  s += '<line x1="'+L+'" y1="'+(T+ih)+'" x2="'+(W-R)+'" y2="'+(T+ih)+'" stroke="#eef3f1"/>';
  rows.forEach(function(r,i){
    var v = valFn(r);
    var h = v/mx*ih;
    var x = L + bw*i + (bw-barW)/2;
    var y = T + ih - h;
    var last = (i === rows.length-1);
    s += '<rect x="'+x.toFixed(1)+'" y="'+(v>0 ? y : T+ih-2).toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(v>0?2:0,h).toFixed(1)+'" rx="3" fill="'+color+'" opacity="'+(last?1:0.42)+'"/>';
    if(last && v>0) s += '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-size="9" font-weight="700" fill="#3d4f47">'+fmt(v)+'</text>';
    s += '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="8" fill="#a8b5af">'+(i%2===0||last ? r.k.slice(5).replace('-','/') : '')+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';
}
function deltaTxt(v, unit){
  if(!v) return '<span style="color:#96a49e">与上周持平</span>';
  return '<span style="color:'+(v>0?'#0b9e72':'#df5f55')+'">'+(v>0?'+':'')+fmt(v)+' '+unit+' 较上周</span>';
}

/* ================= 交互 ================= */
document.addEventListener('click', function(e){
  var node = e.target.closest('[data-act]');
  if(!node) return;
  var act = node.getAttribute('data-act');

  switch(act){
    case 'nav':
      ui.view = node.getAttribute('data-view');
      ui.pendingFood = null; ui.pendingStr = null; ui.pendingCar = null;
      window.scrollTo(0,0);
      renderAll();
      break;
    case 'prevDay': ui.date = shiftKey(ui.date,-1); ui.pendingFood=null; ui.pendingStr=null; ui.pendingCar=null; renderAll(); break;
    case 'nextDay': ui.date = shiftKey(ui.date,1); ui.pendingFood=null; ui.pendingStr=null; ui.pendingCar=null; renderAll(); break;
    case 'goToday': ui.date = dkey(new Date()); ui.pendingFood=null; ui.pendingStr=null; ui.pendingCar=null; renderAll(); break;

    /* 整餐 */
    case 'addPlan':
      var pid = node.getAttribute('data-id');
      var p = PLAN.filter(function(x){ return x.id===pid; })[0];
      if(!p) break;
      var dm = getDay(ui.date,true);
      p.items.forEach(function(it){
        dm.meals.push({id:uid(), name:it.n, meal:pid, amt:it.amt, unit:it.unit, kcal:it.kcal, t:Date.now(), p:pid});
      });
      commit();
      toast('已记录'+p.label+' '+p.kcal+' 千卡（'+p.items.length+' 项）');
      break;

    case 'setMeal': ui.meal = node.getAttribute('data-id'); renderDiet(); break;

    case 'pickFood':
      var f = foodLib()[+node.getAttribute('data-i')];
      ui.pendingFood = {n:f.n, k:f.k, base:f.base, unit:f.unit, amt:Number(f.s)||1};
      renderDiet();
      break;
    case 'foodPlus':
      ui.pendingFood.amt = Math.min(2000, (Number(ui.pendingFood.amt)||0) + (ui.pendingFood.unit==='克'?10:1));
      renderDiet(); break;
    case 'foodMinus':
      ui.pendingFood.amt = Math.max(ui.pendingFood.unit==='克'?1:0.5, (Number(ui.pendingFood.amt)||0) - (ui.pendingFood.unit==='克'?10:1));
      renderDiet(); break;
    case 'commitFood':
      var pf = ui.pendingFood;
      if(!pf) break;
      getDay(ui.date,true).meals.push({id:uid(), name:pf.n, meal:ui.meal, amt:pf.amt, unit:pf.unit, kcal:r0(foodKcal(pf, pf.amt)), t:Date.now()});
      ui.pendingFood = null;
      commit(); toast('已加入'+mealLabel(ui.meal)+'：'+pf.n);
      break;
    case 'delMeal':
      var id1 = node.getAttribute('data-id');
      var dm3 = getDay(ui.date,true);
      dm3.meals = dm3.meals.filter(function(x){ return x.id!==id1; });
      commit(); toast('已删除');
      break;
    case 'addCustomFood':
      var n1 = (el('cfName').value||'').trim();
      var kc = Number(el('cfKcal').value);
      var g1 = Number(el('cfGrams').value);
      if(!n1 || !(kc>=0)){ toast('名称和每100克热量都要填'); break; }
      if(!(g1>0)) g1 = 100;
      S.customFoods.push({n:n1, k:r0(kc), unit:'克', s:r0(g1), g:'c'});
      getDay(ui.date,true).meals.push({id:uid(), name:n1, meal:ui.meal, amt:r0(g1), unit:'克', kcal:r0(kc*g1/100), t:Date.now()});
      commit(); toast('已记录：'+n1);
      break;
    case 'copyYesterday':
      var y = peekDay(shiftKey(ui.date,-1));
      if(!y || !(y.meals||[]).length){ toast('昨天没有饮食记录'); break; }
      var dm5 = getDay(ui.date,true);
      y.meals.forEach(function(x){
        dm5.meals.push({id:uid(), name:x.name, meal:x.meal, amt:x.amt, unit:x.unit, kcal:x.kcal, t:Date.now()});
      });
      commit(); toast('已沿用 '+y.meals.length+' 条记录');
      break;

    /* 运动 */
    case 'exTab': ui.exTab = node.getAttribute('data-v'); renderEx(); break;

    case 'pickStr':
      var si = +node.getAttribute('data-i');
      var sEx = STR_DB[si];
      var lEntry = lastStrEntry(sEx.n);
      var seed = lEntry && lEntry.sets && lEntry.sets.length
        ? lEntry.sets.map(function(s){ return {w:s.w, reps:s.reps, sets:s.sets}; })
        : [{w: sEx.bw?0:20, reps:10, sets:3}];
      ui.pendingStr = {idx:si, sets:seed, hr:''};
      renderEx();
      syncStrPreview();
      break;
    case 'strAddRow':
      if(!ui.pendingStr) break;
      var lastRow = ui.pendingStr.sets[ui.pendingStr.sets.length-1] || {w:20, reps:10, sets:3};
      ui.pendingStr.sets.push({w: lastRow.w, reps: lastRow.reps, sets: lastRow.sets});
      renderEx();
      syncStrPreview();
      break;
    case 'strDelRow':
      if(!ui.pendingStr) break;
      var rd = +node.getAttribute('data-i');
      if(ui.pendingStr.sets.length<=1){ toast('至少保留一行'); break; }
      ui.pendingStr.sets.splice(rd,1);
      renderEx();
      syncStrPreview();
      break;
    case 'commitStr':
      if(!ui.pendingStr) break;
      var psx = ui.pendingStr, exx = STR_DB[psx.idx];
      var good = psx.sets.filter(function(s){ return (Number(s.reps)||0)>0 && (Number(s.sets)||0)>0; });
      if(!good.length){ toast('至少填一个有效组'); break; }
      var tot = strTotalSets(good);
      var mn = strMinutes(tot);
      getDay(ui.date,true).ex.push({
        id:uid(), kind:'str', exId:psx.idx, name:exx.n,
        sets: good.map(function(s){ return {w:Number(s.w)||0, reps:Number(s.reps)||0, sets:Number(s.sets)||0}; }),
        minutes: mn,
        hr: Number(psx.hr)||0,
        kcal: r0(burnMet(exx.met, mn, curWeight())),
        t: Date.now()
      });
      ui.pendingStr = null;
      commit();
      toast('已记录 '+exx.n+' · '+tot+' 组');
      break;

    case 'pickCar':
      var cid = node.getAttribute('data-id');
      ui.pendingCar = {type:cid, minutes:'', distance:'', incline:'', hr:'', floors:''};
      renderEx();
      break;
    case 'editCar':
      var eid = node.getAttribute('data-id');
      var dEd = getDay(ui.date,true);
      var rec0 = null;
      dEd.ex.forEach(function(x){ if(x.id===eid) rec0 = x; });
      if(!rec0){ toast('记录不在了'); break; }
      ui.pendingCar = {
        type: rec0.type, editId: rec0.id,
        minutes: rec0.minutes||'', distance: rec0.distance||'',
        incline: rec0.incline||'', hr: rec0.hr||'', floors: rec0.floors||''
      };
      renderEx();
      syncCarPreview();
      var box = document.querySelector('#v-ex .composer');
      if(box && box.scrollIntoView) box.scrollIntoView({block:'center', behavior:'smooth'});
      break;
    case 'cancelCar':
      ui.pendingCar = null;
      renderEx();
      break;
    case 'commitCar':
      if(!ui.pendingCar) break;
      var pcx = ui.pendingCar, cdef = carById(pcx.type);
      if(!(Number(pcx.minutes)>0)){ toast('先填时长'); break; }
      var rec = {
        id: pcx.editId || uid(), kind:'car', type:pcx.type, name:cdef.n,
        minutes: Number(pcx.minutes)||0,
        distance: Number(pcx.distance)||0,
        incline: Number(pcx.incline)||0,
        hr: Number(pcx.hr)||0,
        floors: Number(pcx.floors)||0,
        t: Date.now()
      };
      rec.kcal = r0(cardioKcal(rec));
      var dC = getDay(ui.date,true);
      if(pcx.editId){
        var hit = false;
        dC.ex = dC.ex.map(function(x){ if(x.id===pcx.editId){ hit = true; return rec; } return x; });
        if(!hit) dC.ex.push(rec);
      } else {
        dC.ex.push(rec);
      }
      ui.pendingCar = null;
      commit();
      toast(pcx.editId ? '已保存修改' : ('已记录 '+cdef.n+' '+rec.minutes+' 分钟 · '+rec.kcal+' 千卡'));
      break;

    case 'delEx':
      var id2 = node.getAttribute('data-id');
      var de2 = getDay(ui.date,true);
      de2.ex = de2.ex.filter(function(x){ return x.id!==id2; });
      commit(); toast('已删除');
      break;

    case 'copyLastStr':
      var lsd = lastStrDay();
      if(!lsd){ toast('还没有可沿用的训练'); break; }
      var dcs = getDay(ui.date,true);
      var cnt = 0;
      lsd.list.forEach(function(x){
        dcs.ex.push({
          id:uid(), kind:'str', exId:x.exId, name:x.name,
          sets: JSON.parse(JSON.stringify(x.sets)),
          minutes: x.minutes, kcal: r0(burnMet(STR_DB[x.exId]?STR_DB[x.exId].met:5, x.minutes, curWeight())),
          t: Date.now()
        });
        cnt++;
      });
      commit(); toast('已沿用 '+cnt+' 个动作，记得按当天实际调整重量');
      break;

    case 'saveSteps':
      var sv = Number(el('stepInput').value);
      if(!(sv>=0 && sv<=200000)){ toast('步数填 0-200000 之间'); break; }
      getDay(ui.date,true).steps = Math.round(sv);
      commit(); toast('步数已保存');
      break;

    /* 体重 */
    case 'saveWeight':
      var wv = Number(el('wInput').value);
      if(!(wv>20 && wv<400)){ toast('请输入 20-400 之间的体重'); break; }
      var dv = getDay(ui.date,true);
      dv.weight = Math.round(wv*10)/10;
      S.profile.weight = dv.weight;
      commit(); toast('体重已记录');
      break;
    case 'range': ui.range = Number(node.getAttribute('data-v')); renderWeight(); break;


    /* 设置 */
    case 'useSuggest': S.profile.target = suggestTarget(); commit(); toast('目标已设为 '+S.profile.target+' 千卡'); break;
    case 'resetTarget': S.profile.target = 2000; commit(); toast('已回到食谱 2000 千卡'); break;
    case 'export':
      var blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '减脂记录-'+dkey(new Date())+'.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast('备份已导出');
      break;
    case 'importBtn': el('importFile').click(); break;
    case 'clear':
      if(confirm('清空全部记录？不可撤销，建议先导出备份。')){
        S = blankState(); save(); ui.date = dkey(new Date());
        ui.pendingFood = ui.pendingStr = ui.pendingCar = null;
        renderAll(); toast('已清空');
      }
      break;
  }
});

/* 组数行即时计算：不重渲染，避免输入框失焦 */
function syncStrPreview(){
  var ps = ui.pendingStr;
  if(!ps) return;
  var tot = 0, vol = 0;
  ps.sets.forEach(function(s){
    var w = Number(s.w)||0, rp = Number(s.reps)||0, st = Number(s.sets)||0;
    tot += st; vol += w*rp*st;
  });
  var mn = strMinutes(tot);
  var ex = STR_DB[ps.idx];
  var kcal = r0(burnMet(ex.met, mn, curWeight()));
  var e1 = el('strSum'); if(e1) e1.textContent = '共 '+tot+' 组 · 容量 '+fmt(vol)+' kg';
  var e2 = el('strMin'); if(e2) e2.textContent = mn;
  var e3 = el('strKcal'); if(e3) e3.innerHTML = kcal+'<span> 千卡</span>';
}

document.addEventListener('input', function(e){
  var t = e.target;

  if(ui.pendingStr && t.id==='strHr'){ ui.pendingStr.hr = t.value; return; }
  if(ui.pendingStr && (t.classList.contains('sw') || t.classList.contains('sr') || t.classList.contains('ss'))){
    var row = t.closest('.setrow');
    if(row){
      var i = +row.getAttribute('data-i');
      var fld = t.classList.contains('sw') ? 'w' : (t.classList.contains('sr') ? 'reps' : 'sets');
      ui.pendingStr.sets[i][fld] = Number(t.value)||0;
      syncStrPreview();
    }
    return;
  }
  if(ui.pendingCar){
    if(t.id==='cMin'){ ui.pendingCar.minutes = t.value; syncCarPreview(); return; }
    if(t.id==='cDist'){ ui.pendingCar.distance = t.value; syncCarPreview(); return; }
    if(t.id==='cInc'){ ui.pendingCar.incline = t.value; syncCarPreview(); return; }
    if(t.id==='cHr'){ ui.pendingCar.hr = t.value; syncCarPreview(); return; }
    if(t.id==='cFloors'){ ui.pendingCar.floors = t.value; return; }
  }
});

function syncCarPreview(){
  if(!ui.pendingCar) return;
  var pc = ui.pendingCar;
  var mn = Number(pc.minutes)||0, ds = Number(pc.distance)||0, hr = Number(pc.hr)||0;
  var kcal = r0(cardioKcal({
    type: pc.type, minutes: mn, distance: ds, incline: Number(pc.incline)||0
  }));
  var e = el('carKcal');
  if(e) e.innerHTML = kcal+'<span> 千卡</span>';
  var p = el('carPace');
  if(p) p.textContent = (mn>0 && ds>0) ? ('配速 '+fmtPace(mn, ds)) : '配速 —';
  var z = el('carZone');
  if(z) z.textContent = hr ? ('心率 '+hr+' · '+hrZone(hr)) : '心率区间 —';
}

document.addEventListener('change', function(e){
  var t = e.target;
  if(t.id==='foodAmt' && ui.pendingFood){
    var v = Number(t.value);
    if(v>0) ui.pendingFood.amt = Math.min(2000, v);
    renderDiet();
  }
  if(t.id==='pAge'){ var a1 = Number(t.value); if(a1>=10&&a1<=100){ S.profile.age=a1; commit(); } }
  if(t.id==='pHeight'){ var h1 = Number(t.value); if(h1>=120&&h1<=230){ S.profile.height=h1; commit(); } }
  if(t.id==='pWeight'){ var w1 = Number(t.value); if(w1>20&&w1<400){ S.profile.weight=w1; getDay(ui.date,true).weight=w1; commit(); } }
  if(t.id==='pActivity'){ S.profile.activity = Number(t.value); commit(); }
  if(t.id==='pTarget'){ var g2 = Number(t.value); S.profile.target = (g2>800&&g2<6000)? g2 : 0; commit(); }
  if(t.id==='pTargetWeight'){ var g3 = Number(t.value); S.profile.targetWeight = (g3>20&&g3<400)? g3 : 0; commit(); }
  if(t.id==='importFile' && t.files && t.files[0]){
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var obj = JSON.parse(String(fr.result));
        if(!obj || !obj.days) throw new Error('bad');
        S = obj;
        S.profile = Object.assign(blankState().profile, S.profile||{});
        S.profile.sex = 'male';
        if(!S.customFoods) S.customFoods = [];
        migrateDays(S);
        save(); ui.date = dkey(new Date());
        renderAll(); toast('导入成功');
      }catch(err){ toast('文件格式不对'); }
    };
    fr.readAsText(t.files[0]);
  }
});

document.addEventListener('keydown', function(e){
  if(e.target.tagName==='INPUT' || e.target.tagName==='SELECT' || e.target.tagName==='TEXTAREA') return;
  if(e.key==='ArrowLeft'){ ui.date = shiftKey(ui.date,-1); ui.pendingStr=null; ui.pendingCar=null; renderAll(); }
  if(e.key==='ArrowRight'){ ui.date = shiftKey(ui.date,1); ui.pendingStr=null; ui.pendingCar=null; renderAll(); }
});

renderAll();
</script>
